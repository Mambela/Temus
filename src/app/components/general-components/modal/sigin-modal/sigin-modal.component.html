 
        
<div *ngIf="!isSigningIn">
          <h5 class="modal-title mt-3 text-center">Iniciar Sessão</h5>
          <div class="modal-body">
            <div class="container-fluid">
              <div class="row justify-content-center">
                <div class="col-8">
                  <form #accountSignIn="ngForm" (ngSubmit)="onUserSignIn(accountSignIn)">
                    <div class="form-row">
                      <div class="form-group col-12">
                        <input
                          type="text"
                          name="username"
                          id=""
                          class="form-control"
                          placeholder="Email"
                          ngModel
                        />
                      </div>

                      <div class="from-group col-12">
                        <input
                          type="password"
                          name="password"
                          id=""
                          class="form-control"
                          placeholder="Senha"
                          ngModel
                        />
                      </div>

                      <div class="from-group col-12">
                        <button class="btn btn-success w-100 my-2 font-weight-bold" type="submit">
                          Iniciar Sessão
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
               
            </div>
          </div>
         
        <div class="modal-footer justify-content-center py-2">
          <a href="#" >Criar uma conta</a>
        </div>
</div>         

<!-- Loading  -->
<div class="col-12 loading" *ngIf="isSigningIn">
  <div class="col-3 mx-auto  my-4">
    <app-side-loader></app-side-loader>
  </div>
</div>
