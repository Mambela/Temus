 
    <!-- <div class="modal-dialog modal-md" role="document"> -->
      <div class="modal-content">
         
          <h5 class="text-center mt-3"  *ngIf="!registering">Comece já! É de Graça</h5>
          <hr>

        <!-- <div class="modal-body"> -->
          <div class="container-fluid">
            <div class="row justify-content-center">
              <div class="col-10">

                <form #createAccountForm="ngForm" (ngSubmit)="onCreateUserAccount(createAccountForm)" *ngIf="!registering">
                  <div class="form-row">
                    <div class="form-group col-12">
                      <label for="inputName">Primeiro Nome</label>
                      <input
                        type="text"
                        name="first_name"
                        id="inputName"
                        class="form-control"
                        placeholder="Insira nome completo"
                        ngModel
                        required
                      />
                    </div>

                    <div class="form-group col-12">
                      <label for="inputName">Ultimo Nome</label>
                      <input
                        type="text"
                        name="last_name"
                        id="inputName"
                        class="form-control"
                        placeholder="Insira nome completo"
                        ngModel
                        required
                      />
                    </div>

                    <div class="form-group col-12">
                      <label for="inputEmail">Email</label>
                      <input
                        type="email"
                        name="email"
                        id="inputEmail"
                        class="form-control"
                        placeholder="Insira Email"
                        ngModel
                        required
                      />
                    </div>

                    <div class="form-group col-12">
                      <label for="inputPassword">Senha</label>
                      <input
                        type="password"
                        name="password"
                        id="inputPassword"
                        class="form-control"
                        ngModel
                        required
                      />
                    </div>

                    <div class="form-group col-12">
                      <label for="inputPassword">Confirmar Senha</label>
                      <input
                        type="password"
                        name="confirm_password"
                        id="inputPassword"
                        class="form-control"
                        ngModel
                        required
                      />
                    </div>

                    <div class="form-group col-12">
                      <button type="submit" class="btn btn-primary btn-success w-100 ">
                        Criar Conta
                      </button>
                    </div>
                  </div>
                </form>

                <div class="col-3 mx-auto text-center" *ngIf="registering">
                  <br>
                  <app-side-loader></app-side-loader>
                  <br>
                  <br>
                </div>

              </div>
            </div>
          </div>
        <!-- </div> -->

        <div class="modal-footer justify-content-center "  *ngIf="!registering">
          <a href="#" class="#"> Ainda não tenho uma conta </a>
        </div>
      </div>
    <!-- </div> -->
