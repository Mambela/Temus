<div class="row">
  <div class=" col-xs-3 col-md-3">
      <div class="form-group col-sm-6 col-md-12 col-lg-12">


          <label for="searchInput"> Nome </label>
          <form  #searchForm="ngForm" 
          (ngSubmit)="onSearch(searchForm)">
          <input class="form-control " type="text" id="searchInput" placeholder="Designação do Serviço" name="servicoNome" ngModel/>
  
          <label class="col-form-label col-form-label-sm " for="nomeparam">Categoria </label>
          <select class="custom-select custom-select-sm mb-3 rounded-2 cursor"  name="categoriaParam"  (change)="onCategoriaChange($event)" ngModel>
              <option selected value="" class="cursor">Selecione Categoria</option>
              <option  value="{{categoria.id}}" class="cursor" *ngFor="let categoria of serviceCategoria"  >{{categoria.designacao}}</option>

          </select>

          <label class="col-form-label col-form-label-sm " for="nomeparam">Sub-categoria </label>
          <select class="custom-select custom-select-sm mb-3 rounded-2 cursor" name="subCategoriaParam" ngModel>
            <option selected value="">Selecione Subcategoria</option>
            <option value="{{tipo.id}}" *ngFor="let tipo of serviceSubCategoria">{{tipo.designacao}}</option>
          </select>
  
            <hr>
   
            <label class="col-form-label col-form-label-sm " for="nomeparam">Municipio</label>
              <select class="custom-select custom-select-sm mb-3 rounded-2 cursor" name="municipioParam" (change)="onMunicipioChange($event)" ngModel>
                  <option  class="cursor" value="" selected >Municipios</option>
                  <option  value="{{municipio.id}}" class="cursor"  *ngFor="let municipio of municipios">{{municipio.designacao}}</option>
                   
              </select>
    
              <label class="col-form-label col-form-label-sm " for="nomeparam">Bairro </label>
              <select class="custom-select custom-select-sm mb-3 rounded-2 cursor"  name="bairroParam" ngModel>
                  <option  class="cursor" value="" selected>Bairro</option>
                  <option  value="{{bairro.id}}" class="cursor" *ngFor="let bairro of bairros">{{bairro.designacao}}</option>
                  
              </select>
            <button type="submit" class="btn btn-success"> Pesquisar </button>
          </form>
        </div>
  </div>

    <div class="col-md-9">
      <div class="row" *ngIf="!isEmptyResult && !isSearching" >
        <div class="col-md-9 justify-content-end text-end">
          <ngb-pagination [(collectionSize)]="totalItems" [(pageSize)]="itemsCount" [(page)]="page" [(maxSize)]="last_page" [boundaryLinks]="true"
          (pageChange)="onPageChange(page)" 
          ></ngb-pagination>
        </div>
        <div class="col-md-3">
            <h5> Encontrou {{ totalItems }} serviços </h5>
        </div>
      </div>
      
      <div class="d-flex justify-content-center" *ngIf="isSearching ">
            <app-side-loader></app-side-loader>
      </div>
      <!-- Resultados aparecem aqui -->
      <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4" *ngIf="!isSearching">
          

          <div class="col mb-3" *ngFor="let item of resultItems">
            <div class="card shadow-sm">
              <!-- ELADIO Estas a ver a imagem a baixo preciso que se ajuste com o tamanho do ecra!!! Por favor faz isso!  -->
              <img src="{{_baseUrl + item.empresaId}}/servicos/{{item.imagem}}" height="170px" class="card-img-top" alt="...">
              <div class="card-body pb-n3">
                
                <div class="row ">
                  <div class="col-12 px-2">
                    <h5 class="text-color-main-purple text-truncate"> {{item.name}} </h5>
                    <p class="my-n1 text-dark labels"><i class="fas fa-layer-group"></i> {{item.categoria}}</p>
                    <p class="my-n1 text-secondary labels"><i class="fas fa-building"></i> {{item.empresa}} </p>
                  </div>
                  
                  <div class="col-6 mt-2">
                    <ngb-rating [rate]="3">
                      <ng-template let-fill="fill">
                        <span class="star" [ngClass]="'color'+2"[class.filled]="fill === 100">&#9733;</span>
                      </ng-template>
                    </ngb-rating>
                  </div>
                  <div class="col-6 text-secondary mt-2 mb-n3 text-truncate">
                     <span class="text-truncate mt-3" ><i class="fas fa-map-marker-alt"></i> {{item.bairro}}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        
        </div>
        <!-- Fim dos resulatados -->

        <!-- /For empty results /-->
        <div class="col-sm-12 mt-4">
          <div class="d-flex justify-content-center" *ngIf="isEmptyResult && !isSearching">
            <h2 class="text-color-main-green"> Nenhum resultado para os filtros fornecidos.  </h2>
            <h4 class="text-color-main-green text-center "> </h4> <br><br>
            <br>
          </div>
        </div>
      
          <div class="d-flex justify-content-center" *ngIf="(isEmptyResult && !isSearching)">
                       
            <ul class="text-secondary">
              <li> <h5 class="">Verifique os parametros de pesquisa </h5></li>
              <li><h5 class=""> Verifique se você digitou o serviço corretamente</h5> </li>
            </ul>
            
          </div>
        <!-- /.For empty results ./-->

        <div class="row" *ngIf="!isSearching && !isSearching">
          <div class="col-md-9 justify-content-end text-end">
            <ngb-pagination [(collectionSize)]="totalItems" [(pageSize)]="itemsCount" [(page)]="page" [(maxSize)]="last_page" [boundaryLinks]="true"
            (pageChange)="onPageChange(page)" *ngIf="!isEmptyResult"
            ></ngb-pagination>
          </div>
        </div>
  </div>


</div>
