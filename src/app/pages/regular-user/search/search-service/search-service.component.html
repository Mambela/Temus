<div class="row">
  <div class=" col-xs-3 col-md-3">
      <div class="form-group col-sm-6 col-md-12 col-lg-12">


          <label for="searchInput"> Onde</label>
          <input class="form-control " type="text" id="searchInput"/>
  
          <label class="col-form-label col-form-label-sm " for="nomeparam">Categoria </label>
          <select class="custom-select custom-select-sm mb-3 rounded-2 cursor"  name="nomeparam"  (change)="onCategoriaChange($event)">
              <option selected value="reset" class="cursor">Selecione Categoria</option>
              <option  value="{{categoria.id}}" class="cursor" *ngFor="let categoria of serviceCategoria"  >{{categoria.designacao}}</option>

          </select>

          <label class="col-form-label col-form-label-sm " for="nomeparam">Sub-categoria </label>
          <select class="custom-select custom-select-sm mb-3 rounded-2 cursor" name="nomeparam" >
            <option selected value="reset">Selecione Subcategoria</option>
            <option value="{{tipo.id}}" *ngFor="let tipo of serviceSubCategoria">{{tipo.designacao}}</option>
          </select>
  
            <hr>
   
            <label class="col-form-label col-form-label-sm " for="nomeparam">Municipio</label>
              <select class="custom-select custom-select-sm mb-3 rounded-2 cursor" name="nomeparam" (change)="onMunicipioChange($event)">
                  <option  class="cursor" selected >Municipios</option>
                  <option  value="{{municipio.id}}" class="cursor"  *ngFor="let municipio of municipios">{{municipio.designacao}}</option>
                   
              </select>
    
              <label class="col-form-label col-form-label-sm " for="nomeparam">Bairro </label>
              <select class="custom-select custom-select-sm mb-3 rounded-2 cursor"  name="Bairro">
                  <option  class="cursor" selected>Bairro</option>
                  <option  value="{{bairro.id}}" class="cursor" *ngFor="let bairro of bairros">{{bairro.designacao}}</option>
                  
              </select>
            <button class="btn btn-success"> Pesquisar </button>
        </div>
  </div>

    <div class="col-md-9">
      <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4">
          <div class="col mb-3">
            <div class="card">
              <img src="https://images.pexels.com/photos/4397890/pexels-photo-4397890.jpeg?auto=compress&cs=tinysrgb&h=750&w=1260" height="170px" class="card-img-top" alt="...">
              <div class="card-body">
                <h6 class="card-title">Card title</h6>
                <div class="row">
                  <div class="col-4">
                    <ngb-rating [rate]="3"></ngb-rating>
                  </div>
                  <div class="col-8">
                    <ul class="list-inline  ">
                       
                      <li class="list-inline-item"><a> 459</a> </li>
                      <li class="list-inline-item"><a > 760</a> </li>
                      <li class="list-inline-item"><a > 1600</a> </li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </div>
        
        </div>
    
  </div>


</div>
