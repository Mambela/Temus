<body>
    <app-business-topnavbar></app-business-topnavbar>
    
    <div class="row justify-content-center">
        <div class="col-md-10 ml-1 my-2">
            <h4> Perfil </h4>
        </div>
        <br>
    </div>
    
    <div class="row justify-content-center mt-3">


            <div class="col-md-3  ">
                <div class="list-group">
                    <a class="list-group-item list-group-item-action active" (click)="showAccount()">
                        <span class="col-12 mr-3 profile"><i class="fas fa-lock txt-dk-purple"></i>&nbsp; Conta</span> 
                        <!-- <small class="col-12 text-secondary">Modifique informações como senha</small> -->
                    </a>
                    <a class="list-group-item list-group-item-action " (click)="showCompany()"> 
                        <span class="col-12 mr-3 profile "><i class="fas fa-info txt-dk-purple"></i>&nbsp;Dados da empresa </span>
                        
                    </a>
                    <a  class="list-group-item list-group-item-action" (click)="showAddress()"> 
                        <span class="col-12 mr-3 profile"><i class="fas fa-map-marked-alt txt-dk-purple"></i> &nbsp;Endereço</span>
                    </a>
                    <a  class="list-group-item list-group-item-action" (click)="showSector()">
                        <span class="col-12 mr-3 profile"><i class="fas fa-list txt-dk-purple"></i>&nbsp; Sector / Categoria</span>
                    </a>
                    <a  class="list-group-item list-group-item-action" (click)="showWorkingHours()">
                        <span class="col-12 mr-3 profile "><i class="far fa-clock txt-dk-purple"></i>&nbsp;Horário de Trabalho</span>
                    </a>
                </div>
            </div>

            <!-- Account -->
            <div class="col-md-6 bg-white p-4 rounded border" *ngIf="accountIsActive">

                <div class="row">
                    <div class="col-md-2">
                        <img src="https://i.pinimg.com/236x/ab/5a/73/ab5a738539e17fb0b4adb350a11f39f6--logo-design-contest-media-marketing.jpg" alt="" class="img-fluid rounded-circle">
                    </div>

                    <div class="col-md-8">
                        <h6 class="font-weight-bold mt-4">Bytebymemory</h6>
                    </div>

                </div>

                
                <form>
                    <div class="form-row">
                      <div class="form-group col-md-6">
                        <label for="inputEmail4">Email</label>
                        <input type="email" class="form-control" id="inputEmail4">
                      </div>
                       
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="inputEmail4">Senha Actual</label>
                            <input type="email" class="form-control" id="inputEmail4">
                          </div>
                        
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="inputEmail4">Senha</label>
                            <input type="email" class="form-control" id="inputEmail4">
                          </div>
                          <div class="form-group col-md-6">
                            <label for="inputEmail4">Confirmação da Senha</label>
                            <input type="email" class="form-control" id="inputEmail4">
                          </div>
                    </div>
                    <div class="col-12">
                        <div class="alert alert-warning"> Saiba que ao Alterar as informações da sua conta o applicativo. Você será desconectado</div>
                    </div>
                    
                    <div class="row justify-content-end pr-3">
                        <button type="submit" class="btn btn-success">Actualizar Dados</button>
                    </div>
                    
                  </form>
            </div>

            <!-- Company -->
            <div class="col-md-6 bg-white p-4 rounded border" *ngIf="companyDetailsIsActive">

                
            </div>

            <!-- Address -->
            <div class="col-md-6 bg-white p-4 rounded border" *ngIf="addressIsActive"></div>
            
            <!-- Working Hours -->
            <div class="col-md-6 bg-white p-4 rounded border" *ngIf="sectorIsActive"></div>

            <div class="col-md-6 bg-white p-4 rounded border" *ngIf="workingHoursIsActive">

            </div>
    </div>
    
</body>
