<body>
    <app-business-topnavbar></app-business-topnavbar>

    <ng-sidebar-container>
     
        <ng-sidebar [(opened)]="_opened" 
        [(dock)]="_docked"
        [mode]="_Mode">
             
    
             <app-sidebar></app-sidebar>
            
           
        </ng-sidebar>
        
        <div ng-sidebar-content class="pt-2">
            <div class="row mt-2">
                <div class="col-6 pl-4 ">
                   <a class="left-menu" (click)="_toggleSidebar()"><i class="fas fa-bars fa-2x text-dark"></i> </a>
                </div>
                <div class="col-6">
                   <span class="  mr-md-n3 mt-2"><i class="  text-success float-right mt-2 fas fa-lg" (click)="_toggleRightbar()" [ngClass]="{' fa-caret-square-right': _rightBarOpened === true,
                                                                                                                                    ' fa-caret-square-left ': !_rightBarOpened}"></i></span>
                </div> 
             </div>
             
             <!-- Contetnt of the page  -->
            <div class="col-12">
                <h3 class="col-12"> Gerencia de Produtos</h3>
                <div class="row ml-4 mt-2 justify-content-between px-4">
                    <div class="col-sm-6"><h5>Produtos <span> {{productCount}}</span> </h5>  </div>
                    <div class="col-sm-3"> <p> <span>{{selectedCategoria}}</span><i class="fas fa-angle-right fa-lg mt-1 mx-2"></i><span>{{selectedTipo}}</span> </p></div>
                    
                </div>
                <hr class="col-11 dashed">
                <div class="col sm-12 col-md-12">

                    <div class="row justify-content-end ml-3">
                        <div class="col-sm-6 col-md-3">
                            <!-- <input type="text" class="form-control" placeholder="First name"> -->
                          </div>
                          <div class="col-sm-6 col-md-3 styled-select">
                            <select class="custom-select custom-select mb-1" (change)="onCategoriaChange($event)">
                                <option selected value="reset">Selecione Categoria</option>
                                <option value="{{categoria.id}}" *ngFor="let categoria of productCategoria">{{categoria.designacao}}</option>
                                
                              </select>
                          </div>
                          <div class="col-sm-6 col-md-3 styled-select">
                            <select class="custom-select custom-select mb-3"  (change)="onTipoChange($event)">
                                <option selected value="reset">Selecione Tipo</option>
                                <option value="{{tipo.id}}" *ngFor="let tipo of productTipo">{{tipo.designacao}}</option>
                              </select>
                          </div> 
                          <div class="col-sm-6 col-md-3">
                           <button class="btn btn-success" (click)="onAddProduct()" *ngIf="!isLoadingCategoria">Adicionar Produto</button>
                          </div>
                    </div>
                </div>
                <div class="col-sm-11">
                    <table class="table table-hover bg-white">
                        <thead >
                        <tr class="py-5 text-success">
                          
                          <th scope="col">Nome do Produto</th>
                          <th scope="col">Preço</th>
                          <th scope="col">Stock</th>
                          <th scope="col">Estado</th>
                          <th scope="col">Categoria</th>
                          <th scope="col">Ações</th>
                        </tr>
                        </thead>
                         
                        <tbody *ngIf="!isLoadingProdutos">
                        <tr *ngFor="let product of listOfProducts; index as i">
                           
                          <td>
                            {{ product.designacao }}
                          </td>
                          <td>{{ product.preco | number}} akz</td>
                          <td>{{ product.stock | number }}</td>
                          <td> 
                               <span *ngIf="product.estado === 'true'"><i class="fas fa-circle text-success"></i> Disponivel</span> 
                                <span *ngIf="product.estado === 'false'"><i class="fas fa-circle text-danger"></i> Indisponivel</span> 
                          </td>
                          <td>{{ product.categoria }}</td>
                          <td class="text-grey"><span class="text-grey"><i class="txt-grey fas fa-trash" (click)="onDeleteProduct(product.designacao,product.id)"></i></span>&nbsp; &nbsp;&nbsp; <span><i class="txt-grey fas fa-pen"></i></span></td>

                        </tr>
                        </tbody>
                      </table>
                      <div class="col-sm-2 justify-content-center mx-auto" *ngIf="isLoadingProdutos">
                        <app-data-loading></app-data-loading>
                      </div>
                </div>
                
     
            </div>
        </div>
        <ng-sidebar [(opened)]="_rightBarOpened" 
    position="right"
    [(dock)]="_docked"
    [mode]="_Mode"
    class="right-sidebar"
    >
         

        <app-rightsidebar>

        </app-rightsidebar>
        
       
    </ng-sidebar>
    </ng-sidebar-container>
</body>
