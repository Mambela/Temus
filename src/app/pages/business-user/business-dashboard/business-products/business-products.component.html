<body>
    <app-business-topnavbar></app-business-topnavbar>

    <ng-sidebar-container>
     
        <ng-sidebar [(opened)]="_opened" 
        [(dock)]="_docked"
        [mode]="_Mode">
             
    
             <app-sidebar></app-sidebar>
            
           
        </ng-sidebar>
        
        <div ng-sidebar-content class="pt-3">
            <div class="row mt-2">
                <div class="col-6 pl-4 ">
                   <a class="left-menu" (click)="_toggleSidebar()"><i class="fas fa-bars fa-2x text-dark"></i> </a>
                </div>
                <div class="col-6">
                   <span class="  mr-md-n3 mt-2"><i class="  text-success float-right mt-2 fas fa-lg" (click)="_toggleRightbar()" [ngClass]="{' fa-caret-square-right': _rightBarOpened === true,
                                                                                                                                    ' fa-caret-square-left ': !_rightBarOpened}"></i></span>
                </div> 
             </div>
             
            <div class="col-12">
                <h2 class="col-12"> Gerencia de Produtos</h2>
                <div class="row ml-4 mt-4 justify-content-between px-4">
                    <div class="col-sm-6"><h4>Produtos <span> 350,456</span> </h4>  </div>
                    <div class="col-sm-3"> <p> <span>Categoria</span><i class="fas fa-angle-right fa-lg mt-4 mx-2"></i><span>Tipo</span> </p></div>
                    
                </div>
                <hr class="col-11 dashed">
                <div class="col sm-12 col-md-12">

                    <div class="row justify-content-end ml-3">
                        <div class="col-sm-6 col-md-3">
                            <input type="text" class="form-control" placeholder="First name">
                          </div>
                          <div class="col-sm-6 col-md-3">
                            <select class="custom-select custom-select mb-3">
                                <option selected>Open this select menu</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                              </select>
                          </div>
                          <div class="col-sm-6 col-md-3">
                            <select class="custom-select custom-select mb-3">
                                <option selected>Open this select menu</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                              </select>
                          </div> 
                          <div class="col-sm-6 col-md-3">
                           <button class="btn btn-success">Adicionar Produto</button>
                          </div>
                    </div>
                </div>
                <div class="col-sm-11">
                    <table class="table table-striped bg-white">
                        <thead >
                        <tr class="py-5 text-success">
                          <th class="py-3" scope="col">#</th>
                          <th scope="col">Nome do Produto</th>
                          <th scope="col">Preço</th>
                          <th scope="col">Stock</th>
                          <th scope="col">Estado</th>
                          <th scope="col">Categoria</th>
                          <th scope="col">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr *ngFor="let country of countries; index as i">
                          <th scope="row">{{ i + 1 }}</th>
                          <td>
                            <img [src]="'https://upload.wikimedia.org/wikipedia/commons/' + country.flag" class="mr-2" style="width: 20px">
                            {{ country.name }}
                          </td>
                          <td>{{ country.area | number }}</td>
                          <td>{{ country.population | number }}</td>
                          <td>{{ country.population | number }}</td>
                          <td>{{ country.population | number }}</td>
                          <td class="text-grey"><span class="text-grey"><i class="txt-grey fas fa-trash"></i></span>&nbsp; &nbsp;&nbsp; <span><i class="txt-grey fas fa-pen"></i></span></td>

                        </tr>
                        </tbody>
                      </table>
                </div>
                
     
            </div>
        </div>
        <ng-sidebar [(opened)]="_rightBarOpened" 
    position="right"
    [(dock)]="_docked"
    [mode]="_Mode"
    class="right-sidebar"
    >
         

        <app-rightsidebar>

        </app-rightsidebar>
        
       
    </ng-sidebar>
    </ng-sidebar-container>
</body>
