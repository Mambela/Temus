
<body>
    <app-business-topnavbar></app-business-topnavbar>
    <ng-sidebar-container>
     
        <ng-sidebar [(opened)]="_opened" 
        [(dock)]="_docked"
        [mode]="_Mode">
             
    
             <app-sidebar></app-sidebar>
            
           
        </ng-sidebar>
        <div ng-sidebar-content class="pt-1">
            <div class="row mt-2">
                <div class="col-6 pl-4 ">
                   <button class="left-menu btn btn-light border-0 bg-menu" (click)="_toggleSidebar()"><i class="fas fa-bars fa-lg text-dark"></i> </button>
                </div>
                <div class="col-6">
                   <span class="  mr-md-n3 mt-2"><i class="  text-success float-right mt-2 fas fa-lg" (click)="_toggleRightbar()" [ngClass]="{' fa-caret-square-right': _rightBarOpened === true,
                                                                                                                                    ' fa-caret-square-left ': !_rightBarOpened}"></i></span>
                </div> 
             </div>
             <div class="col-12">
                <h4 class="col-12"> Gerencia de Serviços</h4>
                <div class="row ml-4 mt-2 justify-content-between px-4">
                    <div class="col-sm-6"><h6>Serviços <span> {{serviceCount}}</span> </h6>  </div>
                    <div class="col-sm-5"> <p> <span>{{selectedCategoria}}</span><i class="fas fa-angle-right fa-lg mt-2 mx-2"></i><span>{{selectedTipo}}</span> </p></div>
                    
                </div>
                <hr class="col-11 dashed">
                <div class="col sm-12 col-md-12">
                    <div class="col sm-12 col-md-12">

                        <div class="row justify-content-end ml-3">
                            <div class="col-sm-6 col-md-3">
                                <!-- <input type="text" class="form-control" placeholder="First name"> -->
                              </div>
                              <div class="col-sm-6 col-md-3 styled-select">
                                <select class="custom-select custom-select mb-3" (change)="onCategoriaChange($event)">
                                    <option selected value="reset">Selecione Categoria</option>
                                    <option value="{{categoria.id}}" *ngFor="let categoria of serviceCategoria">{{categoria.designacao}}</option>
                                    
                                  </select>
                              </div>
                              <div class="col-sm-6 col-md-3 styled-select">
                                <select class="custom-select custom-select mb-3"  (change)="onTipoChange($event)">
                                    <option selected value="reset">Selecione Tipo</option>
                                    <option value="{{tipo.id}}" *ngFor="let tipo of serviceTipo">{{tipo.designacao}}</option>
                                  </select>
                              </div> 
                              <div class="col-sm-6 col-md-3">
                               <button class="btn btn-success" *ngIf="!isLoadingServices" (click)="onAddServico()">Adicionar Serviço</button>
                              </div>
                        </div>

                        <!-- TABLE -->

                        <div class="col-sm-11">
                            <table class="table table-hover bg-white">
                                <thead >
                                <tr class="py-5 text-success">
                                  
                                  <th scope="col">Nome do Serviço</th>
                                  <th scope="col">Preço</th>
                                 
                                  <th scope="col">Estado</th>
                                  <th scope="col">Categoria</th>
                                  <th scope="col">Ações</th>
                                </tr>
                                </thead>
                                 
                                <tbody *ngIf="!isLoadingServices">
                                <tr *ngFor="let service of listOfServices; index as i">
                                   
                                  <td>
                                    {{ service.designacao }}
                                  </td>
                                  <td>{{ service.preco | number}} akz</td>
                                  
                                  <td> 
                                        <span *ngIf="service.estado === 'true'"><i class="fas fa-circle text-success"></i> Disponivel</span> 
                                        <span *ngIf="service.estado === 'false'"><i class="fas fa-circle text-danger"></i> Indisponivel</span> 
                                  </td>
                                  <td>{{ service.categoria }}</td>
                                  <td class="text-grey"><span class="text-grey"><i class="txt-grey fas fa-trash" (click)="onDeleteService(service.designacao,service.id)"></i></span>&nbsp; &nbsp;&nbsp; <span><i class="txt-grey fas fa-pen" (click)=openEditServico(contentEditService,service)></i></span></td>
        
                                </tr>
                                </tbody>
                              </table>
                              <div class="col-sm-2 justify-content-center mx-auto" *ngIf="isLoadingServices">
                                <app-data-loading></app-data-loading>
                              </div>
                        </div>

                        <!-- ./TABLE -->


                    </div>
                </div>

             </div>
        </div>

        <ng-sidebar [(opened)]="_rightBarOpened" 
                    position="right"
                    [(dock)]="_docked"
                    [mode]="_Mode"
                    class="right-sidebar"
                    >
                        

                        <app-rightsidebar>

                        </app-rightsidebar>
                        
                    
        </ng-sidebar>
        </ng-sidebar-container>
  
</body>



<ng-template #contentEditService let-modal class="rounded-0 ">

  <div class="bg-color-very-light-purple">

    <div class="col-sm-10 mt-3"><h3> Atualizar Serviço</h3></div>
    <form #updateserviceForm="ngForm" (ngSubmit)="onUpdateService(updateserviceForm)" >
   
      <div class="row justify-content-center">
        <!-- <div class="col-sm-12 col-md-2">
        </div> -->
        
        <div class="col-sm-12 col-md-10 ">
            <div class="form-row">
    
                <div class="col-md-6">
                    <div class="form-group ">
                        <label for="inputEmail4">Editando Serviço - {{serviceEdit.designacao}}</label>
                        
                      </div>
    
                    <div class="form-group">
                        <label for="inputPassword4">Descrição do Serviço</label>
                        <textarea class="form-control form-control-sm border-0" id="exampleFormControlTextarea1" rows="3" required [(ngModel)]="serviceEdit.descricao" name="service_descript" > </textarea>
                      </div>
                    
                  
                    <div class="form-group ">
                        <label for="inputPrice">Preço</label>
                        <input type="number" min="1" class="form-control form-control-sm border-0" id="inputPrice" [(ngModel)]="serviceEdit.preco" name="service_Price" >
                    </div>
                  
                    <div class="custom-control custom-switch col ml-1 mt-2">
                        <input class="custom-control-input" type="checkbox" 
                        [checked]="priceDisplay"  [ngModel]="priceDisplay" (change)="onDisplayPrice(priceDisplay)"
                        name="servicePriceAvailable" id="customPriceAval">
                        <label class="custom-control-label" for="customPriceAval"> {{servicePrice_availability}} preço nas pesquisas</label>
                      </div>
    
                </div>
                <div class="col-md-6 ">
                    
                    <div class="col-md-12 col-lg-12">
                        <input type="file" class="form-control" hidden #uploader (change)="uploadImage($event)" name="businessLogo" />
                        <img [src]="imgURL" class="img-fluid imageUpload" (click)="uploader.click()">
                        <small class="text-color-main-purple  ">Click para adicionar foto do Serviço</small>
                    </div>
                    <div class="custom-control custom-switch col ml-4 mt-2">
                        <input class="custom-control-input" type="checkbox" 
                        [checked]="serviceAvailable"  [ngModel]="serviceAvailable" (change)="onAvailabilityChange(serviceAvailable)"
                        name="serviceAvailable" id="customCheck1">
                        <label class="custom-control-label" for="customCheck1">Serviço {{serviceAvailability}}</label>
                      </div>
                    
                </div>
            </div>
            <hr>
            <div class="row justify-content-end my-3">
              <label class="mx-4 text-success"> </label>
    
              <button class="btn btn-sm btn-secondary" (click)="closeModal()" >Cancelar</button>
              <button class="btn btn-success btn-sm ml-1" type="submit">Atualizar Serviço</button>
          </div>
        </div>
      </div>
    </form>
  </div>

</ng-template>
