<body class="full-screen h-100 meio temus-background">
  <div class="transparent"></div>
    <header class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
      <nav class="container-fluid">
        <a href="#" class="navbar-brand">Temus</a>
        <div class="d-flex justify-content-end">
          <button class="btn btn-primary">Entrar</button>
          <button class="btn btn-primary ml-2">Criar Conta</button>
        </div>  
      </nav>
    </header>
    
    <main class="container">
      <section class="row justify-content-center align-item-center">
          <form action="#" class="col-sm-9">
            <div class="w-100 search-container">
  
              <div class="search-input-container">
  
                <div class="search-icon">
                  <i class="fas fa-search mr-3 ml-3"></i>
                </div>
  
                <div class="input-search">
                  <input type="text" placeholder="Search" class="input-search">
                </div>
  
                <div class="teste-select">
                  <select class="teste-select1" name="searchSection" id="" ngModel>
                    <option value="" disabled selected hidden>Selecionar</option>
                    <option value="produtos">Produtos</option>
                    <option value="local">Locais</option>
                    <option value="servicos">Serviços</option>
                  </select>
                </div>
              </div>
  
              <!-- button search -->
              <div class="search-button-container">
                <button class="btn btn-primary btn-search">pesquisar</button>
              </div>
  
            </div>
          </form>
        </section>  
    </main>
  
    <footer>
      <nav class="navbar fixed-bottom navbar-expand-sm navbar-dark bg-dark">
        <ul class="navbar-nav mr-auto">
          <li><a href="#" class="nav-link" [routerLink]="['/business']" >Conta empresa</a></li>
          <li><a href="#" class="nav-link">Fale connosco</a></li>
          <li><a href="#" class="nav-link">Sobre nós</a></li>
          <li><a href="#" class="nav-link">Criar anúncio</a></li>
          <li><a href="#" class="nav-link">Política de privacidade</a></li>
          <li><a href="#" class="nav-link">Quesitos legais</a></li>
        </ul>
        <ul class="navbar-nav justify-content-end">
          <li><a href="#" class="nav-link">Ignis @ 2020</a></li>
        </ul>
      </nav>
    </footer>
</body>
