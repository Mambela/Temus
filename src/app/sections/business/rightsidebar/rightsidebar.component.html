
<div class="col-12 pt-4">

    <div class="row justify-content-center">
        <div class="col-12">
            <button class="btn btn-sm btn-success mx-auto my-3 px-3 py-2 mx-auto"> Nova Postagem</button>
        </div>      
        <div class="col-12">
            <p> Preechimento de perfil   </p>
        </div>
        
        
    </div>
    

    <div class="col-sm-4 mt-4">
        <circle-progress
        [percent]="percent"
        [radius]="64"
        [outerStrokeWidth]="5"
        [innerStrokeWidth]="0"
        [outerStrokeColor]="color"
        [innerStrokeColor]="'#C7E596'"
        [animation]="true"
        [animationDuration]="190"
    ></circle-progress>
    </div>
    <hr class="col-10">

</div>
