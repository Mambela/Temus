 <body>
    <sigin-sigup-header *ngIf="!isAuthenticated"></sigin-sigup-header>
    <loged-header *ngIf="isAuthenticated"></loged-header>
    <local-option></local-option>

    <main class="min-vh-100">   
        <div class="container"> 
                
            <div class="col-md-12 my-4">
                    <div class="row bg-white shadow-sm rounded-sm">
                        <div class="col-xs-8 col-sm-10 col-lg-6 bg-white py-2 mb-3 ">
                            <h3>{{aLocal.designacao}}</h3>
                            <br>
                            <!-- the details of the street -->
                            <table class="table  table-borderless  mt-3">
                                <thead>
                                <tr>
                                    <th scope="col">{{aLocal.telephone}}</th>
                                    <th scope="col" *ngIf="aLocal.referencia == 1"><label class="font-weight-bold my-2 badge badge-dark py-1"> Um local de referencia </label> </th>
                                    <th scope="col" *ngIf="aLocal.referencia != 1"><span class="badge badge-pill badge-secondary">Nao um local muito frequentado</span></th>

                                </tr>
                                </thead>
                                <tbody>
                                <tr>
                                    <td class="font-weight-bold"><h5> <span class="font-weight-bolder"> {{aLocal.categoria[0].designacao}} </span></h5></td>
                                    <td class="font-weight-bold"><h5>{{aLocal.tipo[0].designacao}} </h5></td>
                                </tr>
                                <!-- <tr>
                                    <td>Larry the Bird</td>
                                    <td>@twitter</td>
                                </tr> -->
                                </tbody>
                            </table>
                            <!-- The actions of the street -->
                            <hr class="mx-1">

                            <div class="row">
                                <div class="col-sm-4">
                                    <button class="btn  btn-success">Check-In</button>
                                </div>
                                <div class="col-sm-4">
                                    <button class="btn  btn-light">Avaliar Local</button>
                                </div>
                                <div class="col-sm-4">
                                    <button class="btn  btn-light">Obter Direcções</button>
                                </div>
                            </div>

                        </div>
                        <div class="col-xs-8 col-sm-10 col-lg-6 pt-2">
                            <img class="img-fluid " src="{{_baseUrl+aLocal.images[0].link}}" >
                        </div>
                    </div>
            </div>

            <div class="col-md-12 my-4">
                <div class="row bg-white">
                    <div class="col-xs-8 col-sm-10 col-lg-6 bg-white p-3 mb-3">
                        <h4>Sobre</h4>
                        <p class="font-weight-bold my-2">{{aLocal.sobre}}</p>
                        <!-- the details of the street -->
                         
                        <!-- The actions of the street -->
                        <hr class="mx-1">

                        <div class="row" disabled>
                            <div class="col" *ngFor="let tag of aLocal.tags">
                                <span class="badge badge-light my-1">{{tag.designacao}}</span>
                            </div>
                             
                            
                        </div>

                    </div>
                    <div class="col-xs-8 col-sm-10 col-lg-6 pt-2">
                         <div id="map"></div>
                    </div>
                </div>
        </div>
            
                
        </div>

    </main>
 </body>
